<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f0" />
    <meta
      name="description"
      content="Study Sprint is a simple 25-minute study routine for calmer, more focused work."
    />
    <title>Study Sprint | A simpler study routine</title>
    <link rel="icon" href="../compcartoon.jpg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a
        class="brand"
        href="../index.html#projects"
        aria-label="Back to portfolio"
      >
        <span>Study Sprint</span>
      </a>
      <nav aria-label="Main navigation">
        <a class="portfolio-link" href="../index.html#projects"
          >Back to portfolio</a
        >
      </nav>
    </header>

    <main>
      <section class="hero focus-page" id="home" aria-labelledby="hero-title">
        <div class="hero-inner">
          <p class="eyebrow">FOCUS MODE</p>
          <h1 id="hero-title">Study Sprint</h1>
          <p class="hero-copy">
            Set a timer, stay on task, and keep moving with a calm, simple
            rhythm.
          </p>
        </div>
        <div class="timer-widget" id="focus-timer">
          <time id="focus-time" datetime="PT25M">25:00</time>
          <div class="timer-controls">
            <button class="timer-start" id="timer-start" type="button">
              Start timer
            </button>
            <button class="timer-reset" id="timer-reset" type="button">
              Reset
            </button>
          </div>
          <p id="timer-status" aria-live="polite">Ready when you are.</p>
        </div>
      </section>
    </main>

    <footer>
      <span>Stay sharp. Keep it simple.</span>
    </footer>
  </body>
</html>
