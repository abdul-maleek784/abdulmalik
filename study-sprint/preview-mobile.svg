  <text x="600" y="168" text-anchor="middle" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-size="48" font-weight="700">Study Sprint</text>
  <text x="600" y="197" text-anchor="middle" fill="#ffffff" fill-opacity=".88" font-family="DM Sans, sans-serif" font-size="15">Set a timer, stay on task, and keep moving with a calm, simple rhythm.</text>
