  <text x="600" y="291" text-anchor="middle" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-size="58" font-weight="600">25:00</text>
  <rect x="440" y="314" width="178" height="44" rx="6" fill="#d9ef8a" />
  <text x="529" y="342" text-anchor="middle" fill="#172c2b" font-family="DM Sans, sans-serif" font-size="13" font-weight="700">Start timer</text>
  <rect x="630" y="314" width="110" height="44" rx="6" fill="#0f3532" stroke="#ffffff" stroke-opacity=".4" />
  <text x="685" y="342" text-anchor="middle" fill="#ffffff" font-family="DM Sans, sans-serif" font-size="13" font-weight="700">Reset</text>
  <text x="600" y="393" text-anchor="middle" fill="#d9ef8a" font-family="DM Sans, sans-serif" font-size="13">Ready when you are.</text>
