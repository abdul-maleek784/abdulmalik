<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">Study Sprint mobile preview</title>
  <desc id="description">Compact mobile layout with the Study Sprint heading above a focus timer and its controls.</desc>
  <rect width="1200" height="480" fill="#f4f6f0" />
  <rect width="1200" height="70" fill="#ffffff" />
  <path d="M0 69.5h1200" stroke="#dce4dd" />
  <text x="64" y="45" fill="#172c2b" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="700">maleek</text>
  <rect x="1040" y="20" width="96" height="34" rx="6" fill="#ffffff" stroke="#dce4dd" />
  <text x="1088" y="42" text-anchor="middle" fill="#687875" font-family="DM Sans, sans-serif" font-size="12" font-weight="600">Portfolio</text>
  <rect y="70" width="1200" height="410" fill="#123f3b" />
  <path d="M750 70h450v410H835z" fill="#1a584e" />
  <path d="M920 70h280v410H1020z" fill="#244f45" />
  <path d="M850 480l210-410M1010 480l150-410" stroke="#d9ef8a" stroke-opacity=".16" stroke-width="2" />
